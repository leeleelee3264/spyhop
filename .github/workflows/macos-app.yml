name: macOS app

# PR 에서는 앱이 빌드되는지만 보고, 릴리즈를 내면 DMG 를 만들어 그 릴리즈에 붙인다
on:
  pull_request:
    paths: ['macos/**', 'LICENSE', '.github/workflows/macos-app.yml']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests
        # 브라우저 화면(test_board_ui)·동시 요청(test_robustness)·데모 화면(test_topic_groups) 시험은 러너 환경에 따라 결과가 달라 로컬에서만 돌린다
        run: cd macos/board/tests && /usr/bin/python3 -m unittest test_lifecycle test_omp test_focus test_summary_lang
      - run: macos/build.sh --dmg
      - name: Check the bundle
        run: |
          plutil -lint macos/build/Spyhop.app/Contents/Info.plist
          lipo -archs macos/build/Spyhop.app/Contents/MacOS/Spyhop
          codesign --verify macos/build/Spyhop.app
          test -f macos/build/Spyhop.app/Contents/Resources/spyhop/board.py

  release:
    if: github.event_name == 'release'
    runs-on: macos-14
    permissions:
      contents: write  # 릴리즈에 DMG 를 붙이는 데만 쓴다
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: SPYHOP_VERSION="${TAG#v}" macos/build.sh --dmg
      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" macos/build/Spyhop-*.dmg --clobber
